<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARGIRL | Login Admin</title>
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Estilos do Admin -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
</head>
<body class="login-body">

  <main class="login-card">
    <div class="login-badge">⭐</div>
    <h2>STARGIRL ADMIN</h2>
    <p>Acesso ao painel de gestão</p>

    <!-- Feedback de Erro -->
    <div id="loginErrorMessage" style="display: none; background: #FFE5EC; color: #D6336C; border: 1.5px solid #FF80A0; padding: 10px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 16px; font-weight: 600;"></div>

    <!-- Formulário Centralizado Conforme PROMPT MESTRE -->
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail"><i class="fas fa-envelope"></i> E-mail de Acesso</label>
        <input type="email" id="adminEmail" class="form-input" placeholder="seuemail@exemplo.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="adminPassword"><i class="fas fa-lock"></i> Senha</label>
        <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-primary" id="btnLoginSubmit">
        <i class="fas fa-arrow-right-to-bracket"></i> Acessar Painel
      </button>
    </form>

    <a href="../index.html" class="login-footer-link">
      <i class="fas fa-arrow-left"></i> Voltar para a Loja Virtual
    </a>
  </main>

  <script>
    const getApiBaseUrl = () => {
      if (window.location.port === '5500' || window.location.port === '5501') {
        return 'http://localhost:3333/api';
      }
      return '/api';
    };

    const API_LOGIN_URL = `${getApiBaseUrl()}/usuarios/login`;
    const errorBox = document.getElementById('loginErrorMessage');

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const email = document.getElementById('adminEmail').value.trim();
      const senha = document.getElementById('adminPassword').value;
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Autenticando na API...';

      try {
        const response = await fetch(API_LOGIN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok && data.usuario) {
          // Armazena sessão do usuário retornado pela API no localStorage
          localStorage.setItem('y2k_admin_user', JSON.stringify(data.usuario));
          window.location.href = 'dashboard.html';
        } else {
          errorBox.textContent = data.mensagem || 'Usuário ou senha incorretos.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = 'Erro ao conectar à API. Certifique-se de que o backend está ativo e as variáveis do Supabase estão configuradas.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Acessar Painel';
      }
    });
  </script>
</body>
</html>
